name: Update the Trivy cache (reusable workflow)

# Download the Trivy databases once per day and save them in the GitHub cache of the calling repository,
# with the cache key and path expected by aquasecurity/trivy-action, to avoid the TOOMANYREQUESTS errors
# from the registries when every Trivy scan downloads the databases itself.
# The Trivy scans then use the restore-trivy-cache action to restore them and skip the databases update.
# See: https://github.com/aquasecurity/trivy-action#updating-caches-in-the-default-branch
#
# The cache must be saved from the default branch to be readable from all the other branches,
# so call this workflow from a scheduled workflow (that runs only on the default branch).

on:
  workflow_call: # reusable workflow

env:
  # Same path and key prefix as aquasecurity/trivy-action, don't change them
  CACHE_DIR: ${{ github.workspace }}/.cache/trivy
  CACHE_KEY_PREFIX: cache-trivy-
  # Registries tried in this order, until one of them works
  TRIVY_DB_REPOSITORIES: >-
    public.ecr.aws/aquasecurity/trivy-db:2
    mirror.gcr.io/aquasec/trivy-db:2
    ghcr.io/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORIES: >-
    public.ecr.aws/aquasecurity/trivy-java-db:1
    mirror.gcr.io/aquasec/trivy-java-db:1
    ghcr.io/aquasecurity/trivy-java-db:1

jobs:
  update-trivy-cache:
    runs-on: ubuntu-latest
    name: Update the Trivy cache
    permissions:
      actions: write # to delete the old caches
    steps:
      - name: Setup oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Download and extract the databases
        run: |
          set -euo pipefail

          # Pull an OCI artifact from the first registry that works, and extract it.
          # Usage: download <archive name> <destination dir> <registry1> <registry2> ...
          download() {
            local archive="$1" dest="$2"
            shift 2
            mkdir -p "$dest"
            for repo in "$@"; do
              echo "Download $archive from $repo"
              if oras pull --no-tty "$repo"; then
                tar -xzf "$archive" -C "$dest"
                rm -f "$archive"
                return 0
              fi
              echo "::warning::Failed to download $archive from $repo"
            done
            echo "::error::Failed to download $archive from all the registries"
            return 1
          }

          download db.tar.gz "$CACHE_DIR/db" $TRIVY_DB_REPOSITORIES
          download javadb.tar.gz "$CACHE_DIR/java-db" $TRIVY_JAVA_DB_REPOSITORIES
          ls -lR "$CACHE_DIR"
        shell: bash

      # The cache of the day may already exist, e.g. if the workflow is run twice or if a Trivy scan
      # saved it with older databases. Delete it, else the save step below fails.
      - name: Delete the cache of the day
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ env.CACHE_KEY_PREFIX }}${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          for id in $(gh cache list --key "$KEY" --limit 1000 --json id,key --jq ".[] | select(.key == \"$KEY\") | .id"); do
            echo "Delete cache: $KEY (id $id)"
            gh cache delete "$id"
          done
        shell: bash

      - name: Save the databases in the cache
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ env.CACHE_KEY_PREFIX }}${{ steps.date.outputs.date }}

      # Each cache takes ~1 GB, only keep the last one so we don't exceed the cache quota of the repository
      - name: Delete the old caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LAST_KEY: ${{ env.CACHE_KEY_PREFIX }}${{ steps.date.outputs.date }}
        run: |
          set -euo pipefail
          # Keep the old caches if the new one could not be saved
          if [[ -z "$(gh cache list --key "$LAST_KEY" --json key --jq ".[] | select(.key == \"$LAST_KEY\") | .key")" ]]; then
            echo "::warning::The cache $LAST_KEY does not exist, keep the old caches"
            exit 0
          fi
          gh cache list --key "$CACHE_KEY_PREFIX" --limit 1000 --json id,key \
            --jq ".[] | select(.key != \"$LAST_KEY\") | \"\\(.id) \\(.key)\"" |
          while read -r id key; do
            echo "Delete cache: $key (id $id)"
            gh cache delete "$id"
          done
        shell: bash
