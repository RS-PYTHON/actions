name: Check code quality (reusable workflow)

on:
  workflow_call: # reusable workflow
    inputs:
      caller-repository:
        description: $ {{ github.repository }} coming from the calling workflow
        type: string
        required: true
      caller-ref:
        description: $ {{ github.ref }} coming from the calling workflow
        type: string
        required: true
      python-version:
        description: Main python version (only for Python projects)
        type: string
        required: false
      run-trivy:
        description: Should we run Trivy ? (security scanner)
        type: boolean
        required: false
        default: true
      ignore-linting-errors:
        description: Ignore linting errors (pylint, flake8) ?
        type: boolean
        required: false
        default: false
      run-mypy:
        description: Should we run Mypy ? (static type checker, only for Python projects)
        type: boolean
        required: false
        default: false
      run-bandit:
        description: Should we run Bandit ? (to find common security issues, only for Python projects)
        type: boolean
        required: false
        default: false
      run-safety:
        description: Should we run Safety ? (dependency vulnerability scanner, only for Python projects)
        type: boolean
        required: false
        default: false
    # secrets:
    #   caller-token:
    #     description: $ {{ github.token }} coming from the calling workflow
    #     required: true

jobs:
  check-pre-commit:
    runs-on: ubuntu-latest
    name: Check pre-commit
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - run: >
          echo
          ":information_source: This job checks that you have run \`pre-commit run --all-files\` in
          your local git repository before committing."
          >> $GITHUB_STEP_SUMMARY
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

  check-license:
    runs-on: ubuntu-latest
    name: Check license headers
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}
      - name: check License Header
        uses: apache/skywalking-eyes/header@8c96ee223558797cdd9eba82c0919258e1cf2dad # main
        with:
          log: debug
          mode: check

  run-trivy:
    runs-on: ubuntu-latest
    name: Run Trivy
    if: ${{ inputs.run-trivy }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}

      - name: Scan local filesystem
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          version: v0.69.3
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: 1

      - name: Scan config files for misconfigurations
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          version: v0.69.3
          scan-type: config
          ignore-unfixed: true
          format: table
          exit-code: 1

  run-linting:
    runs-on: ubuntu-latest
    name: Check linting (pylint, flake8)
    if: ${{ inputs.python-version != '' }} # only for python projects
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install tools
        run: pip install pylint flake8

      - name: Run pylint
        continue-on-error: ${{ inputs.ignore-linting-errors }}
        run: |
          set -x
          pip show pylint
          pylint "**/*.py" --output-format=colorized,parseable:./pylint-report.txt

      - name: Run flake8
        if: always()
        continue-on-error: ${{ inputs.ignore-linting-errors }}
        run: |
          set -x
          pip show flake8
          flake8 . || true # run next line even if fails
          flake8 . --output-file ./flake8-report.txt

      - name: Save reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-linting
          path: |
            ./flake8-report.txt
            ./pylint-report.txt
          retention-days: 1

