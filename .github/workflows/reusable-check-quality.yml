name: Check code quality (reusable workflow)

on:
  workflow_call: # reusable workflow
    inputs:
      caller-repository:
        description: $ {{ github.repository }} coming from the calling workflow
        type: string
        required: true
      caller-ref:
        description: $ {{ github.ref }} coming from the calling workflow
        type: string
        required: true
      python-version:
        description: Main python version (only for Python projects)
        type: string
        required: false
        default: 3.13.12
      run-trivy:
        description: Should we run Trivy ? (security scanner)
        type: boolean
        required: false
        default: true
      ignore-bandit-errors:
        type: boolean
        required: false
        default: false
      ignore-flake8-errors:
        type: boolean
        required: false
        default: false
      ignore-mypy-errors:
        type: boolean
        required: false
        default: false
      ignore-pylint-errors:
        type: boolean
        required: false
        default: false
      ignore-safety-errors:
        type: boolean
        required: false
        default: false
    secrets:
      SAFETY_API_KEY:
        required: true

jobs:

  paths-filter:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      py: ${{ steps.filter.outputs.py }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            py: ['**.py']

  check-pre-commit:
    runs-on: ubuntu-latest
    name: Check pre-commit
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}
      - run: >
          echo
          ":information_source: This job checks that you have run \`pre-commit run --all-files\` in
          your local git repository before committing."
          >> $GITHUB_STEP_SUMMARY
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd

  check-license:
    runs-on: ubuntu-latest
    name: Check license headers
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}
      - name: check License Header
        uses: apache/skywalking-eyes/header@8c96ee223558797cdd9eba82c0919258e1cf2dad # main
        with:
          log: debug
          mode: check

  run-trivy:
    runs-on: ubuntu-latest
    name: Run Trivy
    if: ${{ inputs.run-trivy }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}

      - name: Scan local filesystem
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          version: v0.69.3
          scan-type: fs
          ignore-unfixed: true
          format: table
          exit-code: 1

      - name: Scan config files for misconfigurations
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          version: v0.69.3
          scan-type: config
          ignore-unfixed: true
          format: table
          exit-code: 1

  run-python-tools:
    runs-on: ubuntu-latest
    name: Run Python tools
    needs: paths-filter
    if: ${{ needs.paths-filter.outputs.py == 'true' }} # only for python projects
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
    strategy:
      fail-fast: false
      matrix:
        tool: [bandit, flake8, mypy, pylint, safety]
        if: [always()]
        include:
          - tool: bandit
            continue-on-error: ${{ inputs.ignore-bandit-errors }}
            commands: |
              if [[ -f pyproject.toml ]]; then
                options="-c pyproject.toml"
              fi
              bandit $options -r . || true # run next line even if fails
              bandit $options -r . -f json -o ./bandit-report.json

          - tool: flake8
            continue-on-error: ${{ inputs.ignore-flake8-errors }}
            extra-packages: Flake8-pyproject
            commands: |
              flake8 . || true # run next line even if fails
              flake8 . --output-file ./flake8-report.txt

          - tool: mypy
            continue-on-error: ${{ inputs.ignore-mypy-errors }}
            commands: |
              mypy --install-types --non-interactive --explicit-package-bases .

          - tool: pylint
            continue-on-error: ${{ inputs.ignore-pylint-errors }}
            commands: |
              pylint "**/*.py" --output-format=colorized,parseable:./pylint-report.txt

          - tool: safety
            if: github.actor == 'dependabot[bot]' # dependabot does not have access to secrets
            continue-on-error: ${{ inputs.ignore-safety-errors }}
            extra-packages: typer==0.16.0
            commands: |
              safety --key $SAFETY_API_KEY scan --detailed-output

    steps:
      - if: ${{ matrix.if }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.caller-repository }}
          ref: ${{ inputs.caller-ref }}

      - if: ${{ matrix.if }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - if: ${{ matrix.if }}
        name: Install ${{ matrix.tool }}
        run: |
          set -x
          pip install ${{ matrix.tool }} ${{ matrix.extra-packages }}
          pip list

      - if: ${{ matrix.if }}
        name: Run ${{ matrix.tool }}
        continue-on-error: ${{ matrix.continue-on-error }}
        run: |
          set -x
          pip show ${{ matrix.tool }}
          ${{ matrix.commands }}


