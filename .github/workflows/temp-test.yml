name: Temp test

on:
  push:
#   pull_request:
  workflow_dispatch:

jobs:
  call-reusable-workflow:
    name: _
    uses: RS-PYTHON/actions/.github/workflows/check-code-quality.yml@feat-rspy995/run-sonar-from-project-root
    with:
        caller-repository: ${{ github.repository }}
        caller-ref: ${{ github.ref }}
        caller-ref_name: ${{ github.ref_name }}

        # caller-repository: RS-PYTHON/rs-server
        # caller-ref: refs/heads/feat-rspy995/run-sonar-from-project-root

        # caller-repository: RS-PYTHON/rs-testmeans
        # caller-ref: refs/heads/develop
        # caller-ref_name: develop

    secrets:
        # caller-token: ${{ github.token }}
        inherit

    permissions:
      contents: write # for apache/skywalking-eyes/header
      pull-requests: write # for apache/skywalking-eyes/header and phwt/sonarqube-quality-gate-action

  upload-trivy:
    name: Upload Trivy scan results
    runs-on: ubuntu-latest
    needs: [call-reusable-workflow]
    if: always()
    permissions:
      security-events: write # for github/codeql-action/upload-sarif
    steps:
      - uses: actions/download-artifact@v8
        with:
          name:
            trivy-artifact
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results-fs.sarif
          category: git repository
