name: Clean old GHCR Docker images

on:
  push

env:
  RUN_PARALLEL: false
  DRY_RUN: true
  CACHE_KEY: cache-all
  CACHE_DIR: ./js/cache

jobs:



  mytest:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Restore
        id: restore
        uses: actions/cache/restore@v6
        with:
          key: ${{ env.CACHE_KEY }}
          path: ${{ env.CACHE_DIR }}/**

      - name: Test cache
        run: |
          set -x
          find ${{ env.CACHE_DIR }} || echo not found

      - name: Process
        id: process
        uses: actions/github-script@v9 # run javascript
        with:
          script: |
            console.log("Cache: ${{ env.CACHE_DIR }}/xxx")
            const fs = require("node:fs")
            fs.mkdirSync("${{ env.CACHE_DIR }}/a", { recursive: true} )

            fs.writeFileSync("${{ env.CACHE_DIR }}/a/toto", "titi", "utf8")
            fs.writeFileSync("${{ env.CACHE_DIR }}/a/tutu", "tutu", "utf8")
            fs.writeFileSync("${{ env.CACHE_DIR }}/a/titi", "tete", "utf8")

            throw Error("test !")

      - name: Test before new caching
        if: always()
        run: |
          set -x
          find ${{ env.CACHE_DIR }} || echo not found

      - name: Remove old cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete ${{ env.CACHE_KEY }}

      - name: Save
        if: always()
        uses: actions/cache/save@v6
        with:
          key: ${{ env.CACHE_KEY }}
          path: ${{ env.CACHE_DIR }}/**



  get-images:
    if: false
    name: Get all docker images
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.get-images.outputs.jobs }}
    steps:
      - uses: actions/checkout@v7
      - id: get-images
        name: Get all docker images
        uses: actions/github-script@v9 # run javascript
        env:
          GITHUB_PAT: ${{ secrets.CLEAN_DOCKER_IMAGES }} # github pat with delete:packages,read:packages
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Init octokit, see https://octokit.github.io/rest.js
            const appOctokit = getOctokit(process.env.GITHUB_PAT)

            // Import custom module and get all docker images, sorted by repository
            const { default: mod } = await import('${{ github.workspace }}/js/clean-old-docker.js')
            const imagesByRepo = await mod.getImages(appOctokit)

            // Convert map {repo1: [img1, img2], repo2: [img3, img4]} into
            // [{"repo": repo1, "images": [img1, img2]}, {"repo": repo2, "images": [img3, img4]}]
            // that will be used in the below matrix
            const jobs = []
            imagesByRepo.forEach((value, key) => {jobs.push({"repo": key, "images": value})})

            // Write results to github outputs
            const fs = require("fs")
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `jobs=${JSON.stringify(jobs)}\n`)

  clean-repos-parallel:
    name: Clean from ${{ matrix.job.repo }}
    runs-on: ubuntu-latest
    needs: get-images
    strategy:
      matrix:
        job: ${{ fromJSON(needs.get-images.outputs.jobs) }}
    steps:
      - if: ${{ env.RUN_PARALLEL == 'true' }}
        uses: actions/checkout@v7

      - if: ${{ env.RUN_PARALLEL == 'true' }}
        id: clean-repo
        name: Clean images from ${{ matrix.job.repo }} git repository
        uses: actions/github-script@v9 # run javascript
        env:
          GITHUB_PAT: ${{ secrets.CLEAN_DOCKER_IMAGES }} # github pat with delete:packages,read:packages
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Init octokit, see https://octokit.github.io/rest.js
            const appOctokit = getOctokit(process.env.GITHUB_PAT)

            // Import custom module
            const { default: mod } = await import('${{ github.workspace }}/js/clean-old-docker.js')

            // Clean docker images of this git repo
            repo = "${{ matrix.job.repo }}"
            images = ${{ toJSON(matrix.job.images) }}
            console.log(`\n## Clean ${repo} images: ${images} ##\n`)
            mod.cleanRepo(appOctokit, repo, images, ${{ env.DRY_RUN }})
