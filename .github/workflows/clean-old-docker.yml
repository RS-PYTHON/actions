name: Clean old GHCR Docker images

on:
  push

jobs:
  get-images:
    name: Get all docker images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Get all docker images
        uses: actions/github-script@v9 # run javascript
        env:
          APP_TOKEN: ${{ secrets.CLEAN_DOCKER_IMAGES }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Init octokit, see https://octokit.github.io/rest.js
            const appOctokit = getOctokit(process.env.APP_TOKEN)

            // Run function from custom module
            const { default: mod } = await import('${{ github.workspace }}/js/clean-old-docker.js')
            const imagesByRepo = await mod.getImages(appOctokit)
            console.log(imagesByRepo)
