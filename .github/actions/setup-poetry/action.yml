name: poetry-install
description: "'poetry install' this project and dependencies"

inputs:
  python-version:
    description: "Python version"
    default: 3.13.12
  poetry-version:
    description: "Poetry version"
    default: 2.3.2

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ case(env.PYTHON_VERSION != '', env.PYTHON_VERSION, inputs.python-version) }}
        # NOTE: remove the poetry cache because it's not so fast.
        # Note that to make it work, you need to run actions/checkout@v6
        # with: ref: ${{ case(github.event_name == 'pull_request', github.head_ref, '') }}
        # Then follow https://github.com/actions/setup-python/blob/v6/docs/advanced-usage.md#caching-packages
        # cache: poetry

    - env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
      run: |
        set -x
        pip install --only-binary=:all: poetry==$POETRY_VERSION
        pip install --only-binary=:all: poetry-dynamic-versioning==1.10.0
      shell: bash
