name: tag-push-docker
description: Tag and push Docker images

inputs:
  github_token:
    description: "secrets.GITHUB_TOKEN (required if you have a 'unauthorized: unauthenticated: User cannot be authenticated with the token provided.')"
    required: false
  old_docker_images:
    description: Old Docker images to retag, as a comma-separated list e.g. 'image1:old-tag,image2:old-tag'
    required: true
  new_tags:
    description: New tags to add to old Docker images, as a comma-separated list e.g. 'new-tag1,new-tag2'
    required: true

runs:
  using: "composite"
  steps:

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
      if: ${{ inputs.github_token != '' }}
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    # This is required to push a docker image from a private repository
    - name: Log in to registry
      if: ${{ inputs.github_token != '' }}
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      shell: bash

    - name: Tag and push Docker images
      env:
        OLD_DOCKER_IMAGES: ${{ inputs.old_docker_images }}
        NEW_TAGS: ${{ inputs.new_tags }}
      run: |
        set -x

        # Pull each pushed image in parallel
        for old_image in ${OLD_DOCKER_IMAGES//,/ }; do
          docker pull "$old_image" &
        done
        wait

        # Add new tags and push in parallel
        for old_image in ${OLD_DOCKER_IMAGES//,/ }; do
          for new_tag in ${NEW_TAGS//,/ }; do

            # Remove the tag from the last image, see: https://stackoverflow.com/a/19482947
            # and add the new tag
            new_image="${old_image%:*}:${new_tag}"

            docker tag "$old_image" "$new_image"
            docker push "$new_image" # no background process with '&' because we want to propagate errors
          done
        done
        wait
      shell: bash
