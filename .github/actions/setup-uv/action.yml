name: setup-uv
description: Install Python and uv

inputs:
  python-version:
    description: "Python version"
    required: false
  uv-version:
    description: "uv version"
    required: false

runs:
  using: "composite"
  steps:
    - id: set-env
      name: Set environment
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
        INPUT_UV_VERSION: ${{ inputs.uv-version }}
      run: |
        set -x

        # Priority: environment variable, then action input, then default value
        if [[ -n $PYTHON_VERSION ]]; then
          python_version=$PYTHON_VERSION
        elif [[ -n $INPUT_PYTHON_VERSION ]]; then
          python_version=$INPUT_PYTHON_VERSION
        else
          python_version=3.13.18
        fi

        if [[ -n $UV_VERSION ]]; then
          uv_version=$UV_VERSION
        elif [[ -n $INPUT_UV_VERSION ]]; then
          uv_version=$INPUT_UV_VERSION
        else
          uv_version=0.13.10
        fi

        echo python-version=$python_version >> "$GITHUB_OUTPUT"
        echo uv-version=$uv_version >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ steps.set-env.outputs.python-version }}

    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        version: ${{ steps.set-env.outputs.uv-version }}

    # Use the python interpreter installed above (the first one in the PATH) in all the next uv commands,
    # don't download other versions. NOTE: don't set UV_PYTHON, it would make 'uv pip' install the packages
    # into this python interpreter instead of the project virtual environment.
    - name: Configure uv
      run: |
        set -x
        echo UV_PYTHON_PREFERENCE=only-system >> $GITHUB_ENV
        uv --version
        python --version
      shell: bash
