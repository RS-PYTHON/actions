name: get-image-tag
description: Return the first docker image tag that exists from a list, e.g. 'does-not-exist,latest' will return 'latest'.

inputs:
  image:
    description: Docker image, without the tag, e.g. 'ghcr.io/rs-python/my-service'
    required: true
  tags:
    description: Image tags to test as 'tag1,tag2,tag3'
    required: true

outputs:
  tag:
    description: First tag that exists from the list
    value: ${{ steps.run.outputs.tag }}

runs:
  using: "composite"
  steps:

    - id: run
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ inputs.image }}
        TAGS: ${{ inputs.tags }}
      run: |
        set -x
        set +e # allow errors

        for test_tag in ${TAGS//,/ }; do
          image_and_tag="${IMAGE}:${test_tag}"

          # Check if the docker image exists in the registry
          error_message=$(docker manifest inspect "$image_and_tag" 2>&1)
          error=$?

          # If yes, return it
          if [[ "$error" == 0 ]]; then
              echo "Use '$image_and_tag'"
              echo "tag=$test_tag" >> $GITHUB_OUTPUT
              exit 0

          # If not found, test the next tag
          elif [[ "$error_message" == "manifest unknown" ]]; then
            continue

          # For any other error, exit in error
          else
              >&2 echo "$error_message"
              exit 2
          fi
        done
        >&2 echo "Could not find any of the the tags '${TAGS}' for the docker image '${IMAGE}'"
        exit 2
      shell: bash
