name: checkout
description: Checkout github repository and run additional commands

# Add all inputs from https://github.com/actions/checkout that we may need from our actions.
inputs:
  repository:
    description: >
      Repository name with owner. For example, actions/checkout.
      Default: $ {{ github.repository }}
    required: false
  ref:
    description: >
      The branch, tag or SHA to checkout. When checking out the repository that
      triggered a workflow, this defaults to the reference or SHA for that event.
      Otherwise, uses the default branch.
    required: false
  fetch-depth:
    description: >
      Number of commits to fetch. 0 indicates all history for all branches and tags.
      Default: 1
    required: false

runs:
  using: "composite"
  steps:

    - run: set -x; echo POST_CHECKOUT_COMMANDS=$POST_CHECKOUT_COMMANDS; echo POST_CHECKOUT_COMMANDS="${{ env.POST_CHECKOUT_COMMANDS }}"
      shell: bash

    - uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - if: ${{ env.POST_CHECKOUT_COMMANDS != '' }}
      env:
        GITHUB_JOB: ${{ github.job }}
      run: set -x; ${{ env.POST_CHECKOUT_COMMANDS }}
      shell: bash
