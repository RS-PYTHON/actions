name: build-wheel
description: Build wheel and sdist

# WARNING, needs:
# - uses: actions/checkout@v6
#   with:
#     fetch-depth: 0 # so that Dunamai produce the correct version

inputs:
  package_directory:
    description: Sub project directory
    required: false
    default: .

outputs:
  version_name:
    description: Wheel version name, calculated from the git tag or commit, e.g. 'x.y' or 'x.y.postz.dev0'
    value: ${{ steps.version_name.outputs.version_name }}
  package_name:
    description: Wheel package name e.g. 'component-x.y.postz.dev0-py3-none-any.whl'
    value: ${{ steps.package_name.outputs.package_name }}
  sdist_name:
    description: Source package name e.g. 'component-x.y.postz.dev0-py3-none-any.tar.gz'
    value: ${{ steps.sdist_name.outputs.sdist_name }}

runs:
  using: "composite"
  steps:

    # Put inputs used in scripts into environment variables for safety purposes (to avoid code substitution)
    # See https://sonarcloud.io/organizations/rs-python/rules?open=githubactions%3AS7630&rule_key=githubactions%3AS7630
    - name: Set up environment variables
      env:
        PACKAGE_DIRECTORY: ${{ inputs.package_directory }}
      run: |
        echo "Creating environment variables for the given inputs..."
        echo "PACKAGE_DIRECTORY=${PACKAGE_DIRECTORY}" >> $GITHUB_ENV
      shell: bash

    - uses: RS-PYTHON/actions/.github/actions/setup-poetry@feat-rspy964/push-latest-after-tests

    # Run 'poetry dynamic-versioning' from the root folder to find the version name, sed the result
    - name: Find version name
      id: version_name
      run: |
        set -x
        echo "version_name=$(poetry dynamic-versioning |& sed -n 's|Version: ||p')" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Build wheel and sdist
      run: |
        set -x
        cd ${{ env.PACKAGE_DIRECTORY }}
        poetry build
      shell: bash

    # Note: the wheel file is built in package_directory/dist
    - name: Find wheel filename
      id: package_name
      run: set -x; echo package_name=$(basename ${{ env.PACKAGE_DIRECTORY }}/dist/*.whl) >> "$GITHUB_OUTPUT"
      shell: bash

    # Note: the sdist file is built in package_directory/dist
    - name: Find sdist filename
      id: sdist_name
      run: set -x; echo sdist_name=$(basename ${{ env.PACKAGE_DIRECTORY }}/dist/*.tar.gz) >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Save wheel package as artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ steps.package_name.outputs.package_name }}
        path: ${{ env.PACKAGE_DIRECTORY }}/dist/${{ steps.package_name.outputs.package_name }}

    - name: Save sdist as artifact
      uses: actions/upload-artifact@v5
      with:
        name: ${{ steps.sdist_name.outputs.sdist_name }}
        path: ${{ env.PACKAGE_DIRECTORY }}/dist/${{ steps.sdist_name.outputs.sdist_name }}
