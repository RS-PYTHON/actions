name: get-repo-branch
description: From a git repository, return the first branch that exists from a list

inputs:
  repo:
    description: The account owner and name (without the .git extension) of the repository, as 'repository-owner/repository-name'
    required: true
  branches:
    description: Branch names to test as 'branch1,branch2,branch3'
    required: true

outputs:
  branch:
    description: First branch that exists from the list
    value: ${{ steps.run.outputs.branch }}

runs:
  using: "composite"
  steps:

    - id: run
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ inputs.repo }}
        BRANCHES: ${{ inputs.branches }}
      run: |
        set -x
        for test_branch in ${BRANCHES//,/ }; do
          if gh api "repos/${REPO}/branches/${test_branch}" --silent 2>/dev/null; then
            echo "branch=$test_branch" >> $GITHUB_OUTPUT
            exit 0
          fi
        done
        >&2 echo "Could not find any of the the branches '${BRANCHES}' in the git repository '${REPO}'"
        exit 2
      shell: bash
