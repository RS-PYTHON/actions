# Configuration of the Python tools run by the pre-commit hooks and by the code quality check

[tool.black]
line-length = 120

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203" # whitespace before ':'
]

[tool.pylint]
max-line-length = 120
